# 固定问数测试集
# 每条用例用 expected_sql 作为黄金 SQL，评测时在真实数仓上执行，
# 再把 Agent 生成的 SQL 执行结果与黄金结果做对比，判断该题是否答对。
- query: 统计所有订单的销售总额
  expected_sql: SELECT SUM(order_amount) AS 销售总额 FROM fact_order

- query: 所有订单的平均订单金额是多少
  expected_sql: SELECT AVG(order_amount) AS 平均订单金额 FROM fact_order

- query: 统计华北地区的销售总额
  expected_sql: |
    SELECT SUM(fo.order_amount) AS 销售总额
    FROM fact_order fo
    JOIN dim_region dr ON fo.region_id = dr.region_id
    WHERE dr.region_name = '华北'

- query: 各大区的销售总额分别是多少
  expected_sql: |
    SELECT dr.region_name AS 大区, SUM(fo.order_amount) AS 销售总额
    FROM fact_order fo
    JOIN dim_region dr ON fo.region_id = dr.region_id
    GROUP BY dr.region_name

- query: 华东地区的订单总额是多少
  expected_sql: |
    SELECT SUM(fo.order_amount) AS 订单总额
    FROM fact_order fo
    JOIN dim_region dr ON fo.region_id = dr.region_id
    WHERE dr.region_name = '华东'

- query: 手机数码类商品的总销售额是多少
  expected_sql: |
    SELECT SUM(fo.order_amount) AS 总销售额
    FROM fact_order fo
    JOIN dim_product dp ON fo.product_id = dp.product_id
    WHERE dp.category = '手机数码'

- query: 黄金会员的订单总额是多少
  expected_sql: |
    SELECT SUM(fo.order_amount) AS 订单总额
    FROM fact_order fo
    JOIN dim_customer dc ON fo.customer_id = dc.customer_id
    WHERE dc.member_level = '黄金'

- query: 2025年1月的销售总额是多少
  expected_sql: |
    SELECT SUM(fo.order_amount) AS 销售总额
    FROM fact_order fo
    JOIN dim_date dd ON fo.date_id = dd.date_id
    WHERE dd.year = 2025 AND dd.month = 1

- query: 各品牌的销量分别是多少
  expected_sql: |
    SELECT dp.brand AS 品牌, SUM(fo.order_quantity) AS 销量
    FROM fact_order fo
    JOIN dim_product dp ON fo.product_id = dp.product_id
    GROUP BY dp.brand

- query: 各会员等级的订单总额分别是多少
  expected_sql: |
    SELECT dc.member_level AS 会员等级, SUM(fo.order_amount) AS 订单总额
    FROM fact_order fo
    JOIN dim_customer dc ON fo.customer_id = dc.customer_id
    GROUP BY dc.member_level

- query: 北京市的销售总额是多少
  expected_sql: |
    SELECT SUM(fo.order_amount) AS 销售总额
    FROM fact_order fo
    JOIN dim_region dr ON fo.region_id = dr.region_id
    WHERE dr.province = '北京市'

- query: 耐克品牌商品的销售额是多少
  expected_sql: |
    SELECT SUM(fo.order_amount) AS 销售额
    FROM fact_order fo
    JOIN dim_product dp ON fo.product_id = dp.product_id
    WHERE dp.brand = '耐克'

- query: 华东地区手机数码类商品的销售额是多少
  expected_sql: |
    SELECT SUM(fo.order_amount) AS 销售额
    FROM fact_order fo
    JOIN dim_region dr ON fo.region_id = dr.region_id
    JOIN dim_product dp ON fo.product_id = dp.product_id
    WHERE dr.region_name = '华东' AND dp.category = '手机数码'

- query: 2025年第一季度的订单笔数是多少
  expected_sql: |
    SELECT COUNT(*) AS 订单笔数
    FROM fact_order fo
    JOIN dim_date dd ON fo.date_id = dd.date_id
    WHERE dd.year = 2025 AND dd.quarter = 'Q1'
